name: Package desktop application
on: { workflow_dispatch: {}, push: { tags: ['v*'] } }
jobs:
  package:
    strategy: { matrix: { os: [macos-14, windows-2022] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm ci
      - run: python -m pip install pyinstaller -r backend/requirements-runtime.txt
      - run: python scripts/package_backend.py
      - run: npm run build
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with: { name: PineClinic-${{ runner.os }}, path: release/** }
